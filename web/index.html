<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sentinel Atlas · God’s Eye View</title>
    <script src="https://unpkg.com/globe.gl@2.37.0"></script>
    <style>
      :root { color-scheme: dark; --bg:#070b16; --panel:rgba(15,23,42,.82); --line:#263653; --muted:#91a1bd; --cyan:#67e8f9; --green:#86efac; --orange:#fdba74; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; overflow:hidden; background:radial-gradient(circle at 50% 40%,#182b4a 0,#070b16 58%); color:#f8fafc; font:14px Inter,Segoe UI,system-ui,sans-serif; }
      #globe { position:fixed; inset:0; }
      #map { position:fixed; inset:0; display:none; }
      body.map-mode #globe { display:none; }
      body.map-mode #map { display:block; }
      .hud { position:fixed; inset:0; pointer-events:none; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
      .topbar,.bottombar { display:flex; align-items:center; justify-content:space-between; gap:16px; pointer-events:auto; }
      .brand,.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 36px #0006; backdrop-filter:blur(14px); }
      .brand { padding:12px 16px; }
      .brand strong { display:block; letter-spacing:.12em; text-transform:uppercase; font-size:12px; color:var(--cyan); }
      .brand span { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
      .status { color:var(--green); font-size:12px; }
      .panel { padding:12px; }
      .tools { display:flex; gap:8px; align-items:center; }
      input { width:220px; border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:#dbeafe; background:#111c31; font:inherit; }
      .inspector { position:fixed; right:20px; top:92px; max-width:280px; pointer-events:auto; }
      .inspector[hidden] { display:none; }
      .inspector strong { color:var(--cyan); }
      .filters { display:flex; gap:8px; flex-wrap:wrap; }
      button { border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:#dbeafe; background:#111c31; cursor:pointer; font:inherit; }
      button:hover,button.active { border-color:var(--cyan); color:var(--cyan); background:#123047; }
      .legend { display:flex; gap:14px; color:var(--muted); font-size:12px; }
      .legend span::before { content:""; display:inline-block; width:8px; height:8px; margin-right:5px; border-radius:50%; background:var(--cyan); }
      .legend .ship::before { background:var(--orange); }.legend .sat::before { background:#c4b5fd; }.legend .traffic::before { background:#f87171; }.legend .earthquake::before { background:#f472b6; }
      @media (max-width:600px) { .hud { padding:12px; }.topbar,.bottombar { align-items:flex-start; flex-direction:column; }.bottombar { align-items:stretch; }.legend { justify-content:center; } }
    </style>
  </head>
  <body>
    <div id="globe" aria-label="Globo 3D com dados simulados de localização"></div>
    <div class="hud">
      <div class="topbar">
        <div class="brand"><strong>Sentinel Atlas</strong><span>Centro de inteligência geoespacial · modo demonstração</span></div>
        <div class="tools"><input id="asset-search" type="search" placeholder="Buscar ativo ou cidade" aria-label="Buscar ativo ou cidade" /><div id="api-status" class="panel status">● DEMONSTRAÇÃO · dados simulados</div></div>
      </div>
      <div id="inspector" class="panel inspector" hidden></div>
      <div class="bottombar">
        <div class="panel filters" aria-label="Filtros de camadas">
          <button class="active" data-layer="all">Tudo</button><button data-layer="aircraft">Aviões</button><button data-layer="ship">Navios</button><button data-layer="satellite">Satélites</button><button data-layer="traffic">Trânsito</button><button data-layer="earthquake">Terremotos</button><button id="replay-history">Reproduzir histórico</button><button id="texture-toggle">Luz do dia</button><button id="map-view">Mapa satélite</button>
        </div>
        <div class="panel legend"><span>Aviões</span><span class="ship">Navios</span><span class="sat">Satélites</span><span class="traffic">Trânsito</span><span class="earthquake">Terremotos</span></div>
      </div>
    </div>
    <div id="map" aria-label="Mapa Google com imagens de satélite e trânsito"></div>
    <script>
      const assets = [
        { id:'flight-1', type:'aircraft', label:'JJ 3812 · São Paulo', lat:-23.55, lng:-46.63, color:'#67e8f9', altitude:0.04 },
        { id:'flight-2', type:'aircraft', label:'AD 4520 · Recife', lat:-8.05, lng:-34.9, color:'#67e8f9', altitude:0.04 },
        { id:'ship-1', type:'ship', label:'Cargo Aurora · Santos', lat:-24.0, lng:-46.3, color:'#fdba74', altitude:0.02 },
        { id:'sat-1', type:'satellite', label:'ISS · órbita baixa', lat:20, lng:30, color:'#c4b5fd', altitude:0.18 },
        { id:'sat-2', type:'satellite', label:'Starlink · demonstração', lat:-20, lng:120, color:'#c4b5fd', altitude:0.16 },
        { id:'traffic-1', type:'traffic', label:'Congestionamento · Av. Paulista', lat:-23.561, lng:-46.656, color:'#f87171', altitude:0.01 },
        { id:'traffic-2', type:'traffic', label:'Incidente · Marginal Pinheiros', lat:-23.59, lng:-46.7, color:'#facc15', altitude:0.01 },
      ];
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      const routes = [
        { startLat:-23.55, startLng:-46.63, endLat:-23.59, endLng:-46.7, color:'#f87171', label:'Rota com congestionamento' },
        { startLat:-23.55, startLng:-46.63, endLat:-23.48, endLng:-46.62, color:'#86efac', label:'Rota alternativa' },
      ];
      const satelliteOrbits = [
        { startLat: 20, startLng: -160, endLat: 20, endLng: 30, color: '#c4b5fd', label: 'Órbita ISS' },
        { startLat: -20, startLng: -60, endLat: -20, endLng: 120, color: '#a78bfa', label: 'Órbita Starlink' },
      ];
      const eventRings = [
        { lat: -23.561, lng: -46.656, color: '#f87171' },
        { lat: -23.59, lng: -46.7, color: '#facc15' },
      ];
      const earthquakeSource = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson';
      let googleMap;
      const textures = {
        night: 'https://unpkg.com/three-globe@2.43.0/example/img/earth-night.jpg',
        day: 'https://unpkg.com/three-globe@2.43.0/example/img/earth-blue-marble.jpg',
      };
      let currentTexture = 'night';
      let replayTimer;
      function replaceAssets(type, incoming) {
        for (let index = assets.length - 1; index >= 0; index -= 1) {
          if (assets[index].type === type) assets.splice(index, 1);
        }
        assets.push(...incoming);
        globe.pointsData(assets);
      }
      const globe = Globe()(document.getElementById('globe'))
        .globeImageUrl(textures[currentTexture])
        .backgroundImageUrl('https://unpkg.com/three-globe@2.43.0/example/img/night-sky.png')
        .showAtmosphere(true).atmosphereColor('#67e8f9').atmosphereAltitude(0.18)
        .pointLat('lat').pointLng('lng').pointAltitude('altitude').pointColor('color').pointRadius(0.45)
        .pointLabel(d => `<b>${d.label}</b><br><small>${d.type === 'earthquake' ? 'USGS · fonte pública' : d.type + ' · demonstração'}</small>`)
        .onPointClick(asset => {
          const inspector = document.getElementById('inspector');
          inspector.innerHTML = `<strong>${asset.label}</strong><br><small>Tipo: ${asset.type}<br>Latitude: ${asset.lat.toFixed(4)}<br>Longitude: ${asset.lng.toFixed(4)}<br>Fonte: ${asset.type === 'earthquake' ? 'USGS' : 'demonstração'}</small>`;
          inspector.hidden = false;
        })
        .arcsData([...routes, ...satelliteOrbits]).arcStartLat('startLat').arcStartLng('startLng').arcEndLat('endLat').arcEndLng('endLng').arcColor('color').arcDashLength(0.45).arcDashGap(0.18).arcDashAnimateTime(1800)
        .ringsData(eventRings).ringLat('lat').ringLng('lng').ringColor('color').ringMaxRadius(3).ringPropagationSpeed(1.8).ringRepeatPeriod(1400)
        .pointsData(assets);
      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.25;
      globe.controls().enableDamping = true;
      document.querySelectorAll('[data-layer]').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('[data-layer]').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        const layer = button.dataset.layer;
        globe.pointsData(layer === 'all' ? assets : assets.filter(asset => asset.type === layer));
      }));

      async function loadEarthquakes() {
        try {
          const response = await fetch(earthquakeSource);
          if (!response.ok) throw new Error('USGS indisponível');
          const feed = await response.json();
          const earthquakes = feed.features.map(feature => {
            const [lng, lat, depth] = feature.geometry.coordinates;
            const magnitude = feature.properties.mag ?? 0;
            return { id: `quake-${feature.id}`, type: 'earthquake', lat, lng, color: '#f472b6', altitude: Math.min(Math.max(depth / 10000, 0.01), 0.08), label: `M${magnitude.toFixed(1)} · ${feature.properties.place || 'evento USGS'}` };
          });
          replaceAssets('earthquake', earthquakes);
        } catch (error) {
          console.info('Camada USGS indisponível:', error.message);
        }
      }
      loadEarthquakes();
      setInterval(loadEarthquakes, 120000);

      async function loadStarlink() {
        try {
          const response = await fetch('/api/sources/starlink');
          if (!response.ok) throw new Error('Starlink indisponível');
          const payload = await response.json();
          if (payload.items?.length) {
            replaceAssets('satellite', payload.items);
          }
        } catch (error) {
          console.info('Camada Starlink indisponível:', error.message);
        }
      }
      loadStarlink();
      setInterval(loadStarlink, 300000);

      document.getElementById('texture-toggle').addEventListener('click', event => {
        currentTexture = currentTexture === 'night' ? 'day' : 'night';
        globe.globeImageUrl(textures[currentTexture]);
        event.currentTarget.textContent = currentTexture === 'night' ? 'Luz do dia' : 'Luz noturna';
      });

      async function replayHistory() {
        const status = document.getElementById('api-status');
        clearInterval(replayTimer);
        try {
          const response = await fetch('/api/positions/history?limit=250');
          const history = await response.json();
          if (!Array.isArray(history) || !history.length) throw new Error('nenhuma posição registrada');
          const points = [...history].reverse();
          let index = 0;
          const showNext = () => {
            const point = points[index];
            replaceAssets('history', [{ ...point, id: 'history-replay', type: 'history', lat: point.latitude, lng: point.longitude, color: '#86efac', altitude: 0.03, label: `Histórico GPS · ${new Date(point.timestamp * 1000).toLocaleString()}` }]);
            globe.pointOfView({ lat: point.latitude, lng: point.longitude, altitude: 1.5 }, 450);
            index += 1;
            if (index >= points.length) clearInterval(replayTimer);
          };
          showNext();
          replayTimer = setInterval(showNext, 900);
          status.textContent = `● REPRODUZINDO HISTÓRICO · ${points.length} posições`;
        } catch (error) {
          status.textContent = `● HISTÓRICO INDISPONÍVEL · ${error.message}`;
        }
      }
      document.getElementById('replay-history').addEventListener('click', replayHistory);

      document.getElementById('asset-search').addEventListener('input', event => {
        const query = event.target.value.trim().toLowerCase();
        const matches = query ? assets.filter(asset => asset.label.toLowerCase().includes(query) || asset.type.includes(query)) : assets;
        globe.pointsData(matches);
        if (matches.length === 1) globe.pointOfView({ lat: matches[0].lat, lng: matches[0].lng, altitude: 1.8 }, 700);
      });

      async function refreshApiStatus() {
        const status = document.getElementById('api-status');
        try {
          const response = await fetch('/api/health', { headers: { Accept: 'application/json' } });
          if (!response.ok) throw new Error('API indisponível');
          const data = await response.json();
          status.textContent = `● API ONLINE · ${new Date(data.timestamp * 1000).toLocaleTimeString()}`;
        } catch {
          status.textContent = '● DEMONSTRAÇÃO · API não conectada';
        }
      }
      refreshApiStatus();
      setInterval(refreshApiStatus, 30000);

      async function openSatelliteMap() {
        const status = document.getElementById('api-status');
        try {
          const configResponse = await fetch('/api/public-config');
          const config = await configResponse.json();
          if (!config.google_maps_api_key) throw new Error('adicione GOOGLE_MAPS_API_KEY no .env');
          if (!window.google?.maps) {
            await new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(config.google_maps_api_key)}`;
              script.onload = resolve;
              script.onerror = () => reject(new Error('Google Maps indisponível'));
              document.head.appendChild(script);
            });
          }
          googleMap ??= new google.maps.Map(document.getElementById('map'), {
            center: { lat: -23.5505, lng: -46.6333 }, zoom: 11, mapTypeId: 'satellite',
          });
          new google.maps.TrafficLayer().setMap(googleMap);
          document.body.classList.add('map-mode');
          status.textContent = '● GOOGLE MAPS · satélite + trânsito';
        } catch (error) {
          status.textContent = `● MAPA 2D INDISPONÍVEL · ${error.message}`;
        }
      }
      document.getElementById('map-view').addEventListener('click', openSatelliteMap);
    </script>
  </body>
</html>
